name: Template documentation check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  template-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check starter files and local links
        run: python3 scripts/check_template.py
# Foundation must add chosen-stack install, test, lint/typecheck, and build jobs.
# This workflow does not validate application behavior.
